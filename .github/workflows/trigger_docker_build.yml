name: Trigger Cure Bahmni Docker Build
on:
  push:
    branches: [ develop ]
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch build_publish_emr in cure-bahmni-docker
        run: |
          gh workflow run build_publish_emr.yml -R cureinternational/cure-bahmni-docker --ref cure-master-snomed
        env:
          GH_TOKEN: ${{ secrets.CURE_EMR_ORG_ACCESS_TOKEN }}
